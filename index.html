let authMode = "login";

function openAuth(mode) {
  authMode = mode;
  const modal = document.getElementById("auth-modal");
  modal.style.display = "flex";
  updateAuthForm();
  document.getElementById("auth-error").textContent = "";
}

function closeAuth() {
  document.getElementById("auth-modal").style.display = "none";
}

function toggleAuthMode() {
  authMode = authMode === "login" ? "signup" : "login";
  updateAuthForm();
  document.getElementById("auth-error").textContent = "";
}

function updateAuthForm() {
  const signup = authMode === "signup";

  document.getElementById("auth-title").textContent =
    signup ? "Create your NEARFIX account" : "Welcome to NEARFIX";

  document.getElementById("auth-subtitle").textContent =
    signup ? "Join NEARFIX as a customer or worker." : "Login to continue.";

  document.getElementById("auth-name-group").style.display =
    signup ? "block" : "none";

  document.getElementById("auth-phone-group").style.display =
    signup ? "block" : "none";

  document.getElementById("auth-role-group").style.display =
    signup ? "block" : "none";

  document.getElementById("auth-full-name").required = signup;
  document.getElementById("auth-phone").required = signup;

  document.getElementById("auth-password").autocomplete =
    signup ? "new-password" : "current-password";

  document.getElementById("auth-submit-btn").textContent =
    signup ? "Create Account" : "Login";

  document.getElementById("auth-switch-text").textContent =
    signup ? "Already have an account?" : "New to NEARFIX?";

  document.getElementById("auth-switch-btn").textContent =
    signup ? "Login" : "Create account";
}

async function submitAuth(event) {
  event.preventDefault();

  const errorBox = document.getElementById("auth-error");
  const submitButton = document.getElementById("auth-submit-btn");

  errorBox.textContent = "";
  submitButton.disabled = true;

  try {
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value;

    if (authMode === "signup") {
      const fullName =
        document.getElementById("auth-full-name").value.trim();
      const phone =
        document.getElementById("auth-phone").value.trim();
      const role =
        document.getElementById("auth-role").value;

      if (!fullName || !phone) {
        throw new Error("Please enter your full name and phone number.");
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            phone: phone,
            role: role
          }
        }
      });

      if (error) throw error;

      if (data.session) {
        const { error: profileError } = await supabaseClient.from('profiles').upsert({
          id: data.user.id, full_name: fullName, phone, role
        }, { onConflict: 'id' });
        if (profileError) console.warn('Profile upsert note:', profileError.message);
        await loadAuthenticatedUser(data.session);
        closeAuth();
      } else {
        errorBox.textContent =
          "Account created. Please check your email to confirm your account, then log in.";
      }
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      await loadAuthenticatedUser(data.session);
      closeAuth();
    }
  } catch (error) {
    errorBox.textContent = error.message || "Authentication failed.";
  } finally {
    submitButton.disabled = false;
  }
}

async function loadAuthenticatedUser(session) {
  if (!session?.user) return;

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("id, full_name, phone, role")
    .eq("id", session.user.id)
    .single();

  if (error) {
    throw new Error(
      "Login succeeded, but your profile could not be loaded. " +
      error.message
    );
  }

  const role = String(profile.role || "").toUpperCase();

  if (!["CUSTOMER", "WORKER", "ADMIN"].includes(role)) {
    throw new Error("Your account has an invalid role. Please contact support.");
  }

  state.currentUser = {
    id: session.user.id,
    email: session.user.email,
    full_name: profile.full_name,
    phone: profile.phone,
    role: role
  };

  setRole(role);
  if (role === "WORKER") { await loadWorkerProfile(); }
  if (role === "CUSTOMER") { await loadMyBookings(); }

  document.getElementById("auth-user-label").textContent =
    profile.full_name || session.user.email || "Logged in";

  document.getElementById("auth-login-btn").style.display = "none";
  document.getElementById("auth-signup-btn").style.display = "none";
  document.getElementById("auth-logout-btn").style.display = "inline-block";
}

function setRole(role) {
  // Role is taken from the signed-in user's database profile.
  if (!state.currentUser || state.currentUser.role !== role) {
    return;
  }

  state.role = role;

  const nav = document.getElementById("customer-bottom-nav");
  if (nav) {
    nav.style.display = role === "CUSTOMER" ? "flex" : "none";
  }

  render();
}

async function logoutUser() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert("Logout failed: " + error.message);
    return;
  }

  state.currentUser = null;
  state.role = "CUSTOMER";

  document.getElementById("auth-user-label").textContent = "Not logged in";
  document.getElementById("auth-login-btn").style.display = "inline-block";
  document.getElementById("auth-signup-btn").style.display = "inline-block";
  document.getElementById("auth-logout-btn").style.display = "none";

  document.getElementById("customer-bottom-nav").style.display = "flex";

  closeAuth();
  render();
}

// Restore an existing login when the page is refreshed.
async function restoreAuthSession() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    console.error("Could not restore login:", error.message);
    return;
  }

  if (data.session) {
    try {
      await loadAuthenticatedUser(data.session);
    } catch (error) {
      console.error("Could not load user profile:", error.message);
    }
  }
}

      }
      state.workerProfileLoaded = true;
      if (state.role === "WORKER") render();
    }

    function renderWorkerRole() {
      const p = state.workerProfile || {};
      const skills = Array.isArray(p.skills) ? p.skills : [];
      const skillOptions = ["Electrician", "Plumber", "AC Technician", "Laptop & Computer Repair", "Mechanic", "Carpenter", "Painter", "Welder", "Solar Technician", "Appliance Repair"];
      const selected = (skill) => skills.includes(skill) ? "checked" : "";
      const setup = !state.workerProfileLoaded || !p.profile_complete;
      return `
        <div class="card">
          <div style="font-size:12px;color:var(--muted);font-weight:800;">${setup ? "WORKER PROFILE SETUP" : "WORKER DASHBOARD"}</div>
          <h2 style="margin:6px 0 4px;">${setup ? "Complete your fixer profile" : "My Worker Profile"}</h2>
          <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Add your skills and service details so customers can find you. Your changes will be saved to Supabase.</p>
          <form id="worker-profile-form" onsubmit="saveWorkerProfile(event)">
            <label for="wp-name">Full name</label>
            <input id="wp-name" required value="${escapeHtml(p.full_name || state.currentUser?.full_name || "")}" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;margin:5px 0 12px;" />
            <label for="wp-phone">Phone number</label>
            <input id="wp-phone" required value="${escapeHtml(p.phone || state.currentUser?.phone || "")}" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;margin:5px 0 12px;" />
            <label for="wp-category">Main service / profession</label>
            <select id="wp-category" required style="width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;margin:5px 0 12px;">
              <option value="">Select your main skill</option>
              ${skillOptions.map(x=>`<option value="${x}" ${p.category===x?'selected':''}>${x}</option>`).join("")}
            </select>
            <label>All skills you provide</label>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:8px 0 14px;">
              ${skillOptions.map(x=>`<label style="display:flex;gap:8px;align-items:center;font-size:13px;background:#F8FAFC;padding:9px;border-radius:9px;"><input type="checkbox" name="wp-skills" value="${x}" ${selected(x)} /> ${x}</label>`).join("")}
            </div>
            <label for="wp-area">Service area / city</label>
            <input id="wp-area" required placeholder="e.g. Absor, Turbat" value="${escapeHtml(p.area || "")}" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;margin:5px 0 12px;" />
            <label for="wp-rate">Hourly rate (PKR)</label>
            <input id="wp-rate" type="number" min="0" max="1000000" required value="${p.hourly_rate_pkr ?? ""}" placeholder="e.g. 900" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;margin:5px 0 12px;" />
            <label style="display:flex;align-items:center;gap:9px;margin:4px 0 16px;"><input id="wp-available" type="checkbox" ${p.is_available !== false ? "checked" : ""}/> I am currently available for jobs</label>
            <p id="wp-error" role="alert" style="color:#b42318;font-size:13px;white-space:pre-wrap;margin-bottom:8px;"></p>
            <button class="btn btn-primary" type="submit">${setup ? "Save Profile & Continue" : "Save Profile Changes"}</button>
          </form>
          ${!setup ? `<p style="font-size:12px;color:var(--muted);margin-top:12px;">Profile saved. Use this form anytime to update your skills, rate, area or availability.</p>` : ""}
        </div>
        <div class="card"><div style="font-size:12px;color:var(--muted);font-weight:800;">DEMO PREVIEW</div><h3 style="margin-top:5px;">Worker Simulation Mode</h3><p style="font-size:13px;color:var(--muted);margin-top:6px;">The technician route below is a demo simulation. Your profile information is saved separately to your account.</p></div>
        ${renderMap()}
      `;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
    }

    async function saveWorkerProfile(event) {
      event.preventDefault();
      const errorBox = document.getElementById("wp-error");
      errorBox.textContent = "";
      if (!state.currentUser || state.currentUser.role !== "WORKER") {
        errorBox.textContent = "Please log in with a worker account first."; return;
      }
      const skills = Array.from(document.querySelectorAll('input[name="wp-skills"]:checked')).map(el => el.value);
      const category = document.getElementById("wp-category").value;
      if (!skills.length) { errorBox.textContent = "Please select at least one skill."; return; }
      if (!skills.includes(category)) skills.push(category);
      const payload = {
        user_id: state.currentUser.id,
        full_name: document.getElementById("wp-name").value.trim(),
        phone: document.getElementById("wp-phone").value.trim(),
        category,
        skills,
        area: document.getElementById("wp-area").value.trim(),
        hourly_rate_pkr: Number(document.getElementById("wp-rate").value),
        is_available: document.getElementById("wp-available").checked,
        profile_complete: true,
        updated_at: new Date().toISOString()
      };
      const { data, error } = await supabaseClient.from("worker_profiles")
        .upsert(payload, { onConflict: "user_id" })
        .select("user_id, full_name, phone, category, skills, area, hourly_rate_pkr, is_available, profile_complete")
        .single();
      if (error) { errorBox.textContent = "Profile save nahi hui: " + error.message + " — pehle Supabase SQL setup run karein."; return; }
      state.workerProfile = data;
      state.workerProfileLoaded = true;
      await loadPublicWorkers();
      render();
      showToast("Worker profile saved successfully!");
    }

    function renderAdminRole() {
      return `
        <div class="card">
          <h3>🛡️ NEARFIX Admin &amp; Verification Portal (Turbat)</h3>
          <p style="font-size:12px;color:var(--muted);margin-top:4px;">Verified Demo Workers: ${WORKERS.filter(w=>w.isVerifiedByAdmin).length}/${WORKERS.length} • Active Dispatches: ${state.bookings.length}</p>
        </div>
        <div class="worker-grid">
          ${WORKERS.map(w => `
            <div class="worker-card">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                  <div style="font-weight:900;">${w.name}</div>
                  <div style="font-size:11px;color:var(--muted);">CNIC: ${w.cnicMasked} • ${w.area}</div>
                </div>
                <button class="chip ${w.isVerifiedByAdmin?'active':''}" onclick="w=WORKERS.find(x=>x.id==='${w.id}');w.isVerifiedByAdmin=!w.isVerifiedByAdmin;render();showToast('Verification updated!');">
                  ${w.isVerifiedByAdmin?'✓ Verified':'Unverified'}
                </button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function render() {
      const main = document.getElementById("main-content");
      if (state.role === "WORKER") { main.innerHTML = renderWorkerRole(); return; }
      if (state.role === "ADMIN") { main.innerHTML = renderAdminRole(); return; }
      if (state.screen === "CHAT") main.innerHTML = renderChat();
      else if (state.screen === "WORKERS") main.innerHTML = renderSearch();
      else if (state.screen === "MAP") main.innerHTML = renderMap();
      else if (state.screen === "BOOKINGS") main.innerHTML = renderBookings();
      else main.innerHTML = renderSearch();
    }

    render();
    loadPublicWorkers();
  </script>
</body>
</html>
